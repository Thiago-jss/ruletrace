[project]
name = "ruletrace"
version = "0.1.0"
description = "Version-aware RAG with bounded tool calling and reproducible evaluation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "langchain-ollama>=1,<2",
  "langchain-text-splitters>=1,<2",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6,<7",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "reportlab>=4,<5"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: tests requiring a live PostgreSQL instance"]
